<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>安全验证</title>
<!-- 与官网登录使用同一个腾讯云验证码 SDK -->
<script src="https://ssl.captcha.qq.com/TCaptcha.js"></script>
<style>
	html, body {
		height: 100%;
		margin: 0;
		background: rgba(0, 0, 0, 0.45);
	}
	body {
		font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
		-webkit-tap-highlight-color: transparent;
	}
	.foot {
		position: fixed;
		left: 0;
		right: 0;
		bottom: 0;
		padding: 0 40px 40px;
		text-align: center;
	}
	.tip {
		color: rgba(255, 255, 255, 0.85);
		font-size: 13px;
		line-height: 1.7;
		margin-bottom: 18px;
	}
	.btn {
		display: block;
		width: 100%;
		height: 44px;
		line-height: 44px;
		padding: 0;
		border: none;
		border-radius: 8px;
		font-size: 15px;
		color: #fff;
		background: #13c2c2;
	}
	.btn-plain {
		margin-top: 12px;
		background: rgba(255, 255, 255, 0.16);
		color: rgba(255, 255, 255, 0.9);
	}
</style>
</head>
<body>
	<div class="foot">
		<div class="tip" id="tip">正在唤起安全验证…</div>
		<button class="btn" id="startBtn">重新唤起验证</button>
		<button class="btn btn-plain" id="cancelBtn">取消</button>
	</div>

	<script>
		(function () {
			/*
			 * App 端本地验证页（uni-app <web-view> 加载）。
			 *
			 * 结果回传（三条通道同时尝试，宿主取到任意一条即生效）：
			 *   ① window.__tcPayload = JSON 字符串
			 *      —— 宿主用 this.$scope.$getAppWebview().children()[N].evalJS('window.__tcPayload || ""') 轮询读取，
			 *         这是 App 端最可靠的通道：不依赖 opener、不依赖 uni.webview.js；
			 *      （官方 @message 事件在 App 端只保证「后退/销毁」等特定时机触发，不能作为实时回调）
			 *   ② plus.webview.currentWebview().opener().evalJS(...) —— opener 可用时即时回传；
			 *   ③ uni.postMessage —— 页面若引入了 uni.webview.js 则可用。
			 *
			 * 交互说明：腾讯 SDK 的浮层在某些机型/时机（如无用户手势）不会弹出，
			 *   因此「重新唤起验证」按钮每次都重建实例，保证永远可点；并用看门狗复位状态。
			 */
			var RESULT_KEY = '__tcPayload';

			function getQuery(name) {
				var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search || '');
				return m ? decodeURIComponent(m[1]) : '';
			}

			var appid = getQuery('appid');
			var tipEl = document.getElementById('tip');
			var startBtn = document.getElementById('startBtn');
			var cancelBtn = document.getElementById('cancelBtn');
			var instance = null;   // 当前 TCaptcha 实例
			var showing = false;   // 是否已展示过验证浮层
			var settled = false;   // 是否已产生结果
			var wdTimer = null;    // 看门狗

			function setTip(text) {
				if (tipEl) tipEl.innerText = text;
			}

			function clearWatchdog() {
				if (wdTimer) {
					clearTimeout(wdTimer);
					wdTimer = null;
				}
			}

			// 结果持久化：三条存储/全局通道同时写，宿主读到任意一条即可
			function persist(json) {
				window[RESULT_KEY] = json;
				// ① localStorage（与 uni-app 页面同为 App 沙箱域，通常相互可见）
				try { window.localStorage.setItem(RESULT_KEY, json); } catch (e) {}
				// ② plus.storage（App 级 KV，跨 webview 共享，最可靠）
				try {
					if (window.plus && plus.storage) plus.storage.setItem(RESULT_KEY, json);
				} catch (e) {}
			}

			// 结果产生后的一小段时间内反复刷新，避免宿主某次读取落空（宿主取到后会清理该键）
			var keepTimer = null;
			function keepWriting(json) {
				if (keepTimer) clearInterval(keepTimer);
				var n = 0;
				keepTimer = setInterval(function () {
					n++;
					if (n > 15) {
						clearInterval(keepTimer);
						keepTimer = null;
						return;
					}
					persist(json);
				}, 800);
			}

			// 结束：持久化结果 + 快速通道即时回传
			function finish(data) {
				if (settled) return;
				settled = true;
				showing = false;
				clearWatchdog();

				var json = JSON.stringify(data);
				persist(json);
				keepWriting(json);

				// 快速通道 ①：5+ 宿主/父窗口 evalJS（opener 与 parent 都试，可能为空，失败无妨）
				try {
					if (window.plus && plus.webview && plus.webview.currentWebview) {
						var wv = plus.webview.currentWebview();
						var hosts = [];
						if (wv && typeof wv.opener === 'function') {
							var op = wv.opener();
							if (op) hosts.push(op);
						}
						if (wv && typeof wv.parent === 'function') {
							var pa = wv.parent();
							if (pa) hosts.push(pa);
						}
						for (var i = 0; i < hosts.length; i++) {
							try {
								// JSON.stringify 再包一层 → 合法的 JS 字符串字面量，避免引号转义问题
								hosts[i].evalJS('window.__tcResult && window.__tcResult(' + JSON.stringify(json) + ')');
							} catch (e) {}
						}
					}
				} catch (e) {}

				// 快速通道 ②：uni.webview 桥（仅当页面引入了 SDK 时可用）
				try {
					if (window.uni && typeof window.uni.postMessage === 'function') {
						window.uni.postMessage({ data: data });
					}
				} catch (e) {}

				setTip(data.type === 'success' ? '验证已通过，正在返回…' : '已取消验证，正在返回…');
			}

			// 唤起验证浮层
			function start() {
				if (settled) return;
				if (!appid) {
					setTip('缺少验证参数，请返回重试。');
					return;
				}
				if (typeof TencentCaptcha !== 'function') {
					setTip('验证组件加载失败，请检查网络后重试。');
					// 组件不可用时直接回传失败，宿主端可切换到图片验证码兜底
					finish({ type: 'fail', ret: -2 });
					return;
				}
				if (showing) return;
				showing = true;
				setTip('请完成下方滑块验证');
				try {
					instance = new TencentCaptcha(appid, function (res) {
						if (res && res.ret === 0) {
							finish({ type: 'success', ticket: res.ticket || '', randstr: res.randstr || '' });
						} else {
							finish({ type: 'fail', ret: (res && res.ret) || -1 });
						}
					}, {});
					instance.show();
				} catch (e) {
					showing = false;
					setTip('验证组件初始化失败，请点击下方按钮重试。');
					return;
				}
				// 看门狗：1.5s 内没有出现验证浮层，说明被拦截（如缺少用户手势），复位状态提示重试
				clearWatchdog();
				wdTimer = setTimeout(function () {
					wdTimer = null;
					if (settled) return;
					var html = document.documentElement ? document.documentElement.innerHTML : '';
					if (!/tcaptcha|captcha\.qq\.com/i.test(html)) {
						showing = false;
						startBtn.innerText = '开始验证';
						setTip('未弹出验证，请点击下方按钮重试。');
					}
				}, 1500);
			}

			// 用户主动点击：先销毁旧实例并复位，保证按钮永远有效
			startBtn.addEventListener('click', function () {
				if (settled) return;
				showing = false;
				clearWatchdog();
				try {
					if (instance && typeof instance.destroy === 'function') instance.destroy();
				} catch (e) {}
				instance = null;
				start();
			});

			// 取消：回传失败结果（宿主收到后会关闭本页）
			cancelBtn.addEventListener('click', function () {
				finish({ type: 'fail', ret: -1 });
			});

			// SDK 加载失败（离线 / CDN 被拦）：直接回传失败，让宿主端走图片验证码兜底
			window.addEventListener('error', function (e) {
				var t = e && e.target;
				if (t && t.tagName === 'SCRIPT' && /captcha\.qq\.com/i.test(t.src || '')) {
					finish({ type: 'fail', ret: -2 });
				}
			}, true);

			// 进入页面先尝试自动唤起（有用户手势的机型可直接弹出）
			if (document.readyState === 'complete' || document.readyState === 'interactive') {
				start();
			} else {
				window.addEventListener('DOMContentLoaded', start);
			}
		})();
	</script>
</body>
</html>
